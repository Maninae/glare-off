# Deploys app/ to GitHub Pages on every push to main. No build step: app/ is plain
# HTML/CSS/JS and IS the deployed artifact (see app/CLAUDE.md), so this workflow only
# checks out the repo and uploads app/ as-is.
#
# Action versions below were confirmed current against the GitHub API (releases/latest
# for each repo) on 2026-09-25: actions/checkout v7, actions/configure-pages v6,
# actions/upload-pages-artifact v5, actions/deploy-pages v5. Pinned to major-version
# tags, matching GitHub's own convention for its first-party actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; a new push cancels a stale in-progress deploy
# rather than letting two deploys race.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload app/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
